<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gale Boutique – Galerie și inventar</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top">
        <h1>Gale Boutique</h1>
        <nav id="tabs">
            <button class="active" data-tab="galerie">Galerie</button>
            <button data-tab="inventar">Inventar</button>
            <button data-tab="comenzi">Comenzi</button>
            <button data-tab="rapoarte">Rapoarte</button>
        </nav>
    </header>

    <main>
        <!-- GALERIE / ALBUME -->
        <section id="galerie" class="panel active">
            <div class="bar">
                <h2>Albume foto</h2>
                <div id="albume" class="chips"></div>
            </div>
            <div id="grid" class="grid"></div>
        </section>

        <!-- INVENTAR -->
        <section id="inventar" class="panel">
            <h2>Adaugă produs</h2>
            <form id="formProdus" class="form">
                <input name="nume" placeholder="Nume produs" required>
                <input name="categorie" placeholder="Album / categorie (ex. Rochii)" required>
                <input name="pret" type="number" min="1" step="0.01" placeholder="Preț (lei)" required>
                <input name="stoc" type="number" min="0" placeholder="Stoc" required>
                <label class="file">Fotografie <input name="foto" type="file" accept="image/*"></label>
                <button class="btn">Adaugă</button>
            </form>
            <h2>Stoc curent</h2>
            <div class="scroll">
                <table id="tabelProduse"></table>
            </div>
        </section>

        <!-- COMENZI -->
        <section id="comenzi" class="panel">
            <h2>Comandă nouă</h2>
            <form id="formComanda" class="form">
                <input name="client" placeholder="Nume client" required>
                <select name="produs" required></select>
                <input name="cantitate" type="number" min="1" value="1" required>
                <button class="btn">Plasează</button>
            </form>
            <h2>Istoric comenzi</h2>
            <div class="scroll">
                <table id="tabelComenzi"></table>
            </div>
        </section>

        <!-- RAPOARTE -->
        <section id="rapoarte" class="panel">
            <h2>Raport de vânzări</h2>
            <div id="cifre" class="stats"></div>
            <h3>Vânzări pe produs</h3>
            <div class="scroll">
                <table id="tabelRaport"></table>
            </div>
            <button class="btn ghost" id="btnCsv">Descarcă raport (CSV)</button>
        </section>
    </main>

    <!-- Vizualizare mărită -->
    <div id="lightbox" class="lightbox" hidden>
        <button id="prev" aria-label="Anterior">‹</button>
        <figure>
            <img id="lbImg" alt="">
            <figcaption id="lbCap"></figcaption>
        </figure>
        <button id="next" aria-label="Următor">›</button>
        <button id="close" aria-label="Închide">×</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
